name: Lint

# GitHub Actions badges are per-workflow, so the lint checks get their own file and badge.
# ci.yml keeps running them too; this workflow exists for the badge, not for exclusivity.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

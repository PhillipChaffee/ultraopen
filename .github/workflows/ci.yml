name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # opencode ships a Node build and PluginInput degrades when `typeof Bun === "undefined"`,
      # so the sandbox must be verified on plain Node too — not only under `bun test`.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Enforces the 95% coverage gate via bunfig.toml's scalar coverageThreshold.
      - name: Test (Bun, with coverage gate)
        run: bun run test

      - name: Test (Node parity)
        run: bun run test:node

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

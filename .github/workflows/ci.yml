name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS is a first-class opencode platform and exercises different path/permission behaviour
    # than Linux. Windows is left out deliberately: the sandbox parity test relies on POSIX
    # process signals and the reaper's pid probes are not meaningful there.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      # opencode ships a Node build and PluginInput degrades when `typeof Bun === "undefined"`,
      # so the sandbox must be verified on plain Node too — not only under `bun test`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Enforces the 95% coverage gate via bunfig.toml's scalar coverageThreshold.
      - name: Test (Bun, with coverage gate)
        run: bun run test

      - name: Test (Node parity)
        run: bun run test:node

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

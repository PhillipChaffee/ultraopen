name: Coverage

# Dedicated coverage gate: bunfig.toml enforces coverageThreshold on `bun test`, so this
# workflow fails exactly when coverage drops below the gate. Codecov is free for public
# repos and publishes the numeric badge; uploads authenticate with the Actions OIDC
# token (use_oidc), so no secret is stored. ci.yml runs the same suite on the full OS
# matrix; this single-platform copy exists so the coverage badge reflects coverage alone.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      # Enforces the 95% coverage gate via bunfig.toml's scalar coverageThreshold.
      - name: Test (Bun, with coverage gate)
        run: bun run test

      # lcov lines are single tokens (LH:15), so split on the colon, not whitespace.
      - name: Report coverage
        run: |
          LH=$(awk -F: '/^LH:/ {s += $2} END {print s + 0}' coverage/lcov.info)
          LF=$(awk -F: '/^LF:/ {s += $2} END {print s + 0}' coverage/lcov.info)
          test "$LF" -gt 0 || { echo "coverage/lcov.info is missing or empty" >&2; exit 1; }
          awk -v lh="$LH" -v lf="$LF" 'BEGIN {printf "coverage: %.1f%% (%d of %d lines)\n", 100*lh/lf, lh, lf}' >> "$GITHUB_STEP_SUMMARY"

      # OIDC replaces the upload token: no CODECOV_TOKEN secret, no PAT.
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/lcov.info
          use_oidc: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore